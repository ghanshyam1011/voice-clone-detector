<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 700" width="1184" height="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arwP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="4" y="4" width="1176" height="692" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- heading -->
  <text x="34" y="40" font-size="20" font-weight="700" fill="#0f172a">VoiceGuard &#8212; a multi-signal decision pipeline for live high-risk calls</text>
  <text x="34" y="63" font-size="12" fill="#64748b">No single acoustic detector generalises to unseen speech synthesis &#8212; so fuse four weak, partly-independent signals and keep a human in the loop.</text>

  <!-- ============ LEFT INPUTS ============ -->
  <rect x="24" y="230" width="128" height="62" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="88" y="257" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Live call audio</text>
  <text x="88" y="274" font-size="9.5" fill="#64748b" text-anchor="middle">stream or clip</text>

  <rect x="24" y="314" width="128" height="70" rx="9" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="88" y="337" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">Call metadata</text>
  <text x="88" y="353" font-size="8.8" fill="#7c5295" text-anchor="middle">caller known? · amount</text>
  <text x="88" y="366" font-size="8.8" fill="#7c5295" text-anchor="middle">channel · prior flags</text>
  <text x="88" y="379" font-size="8.8" fill="#7c5295" text-anchor="middle">(non-acoustic)</text>

  <line x1="152" y1="261" x2="180" y2="261" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ FRONT-END ============ -->
  <rect x="182" y="192" width="206" height="140" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="285" y="217" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Anti-shortcut front-end</text>
  <text x="285" y="238" font-size="9.6" fill="#475569" text-anchor="middle">mono &#8594; 16 kHz (soxr)</text>
  <text x="285" y="254" font-size="9.6" fill="#475569" text-anchor="middle">uniform silence trim + fixed re-pad</text>
  <text x="285" y="270" font-size="9.6" fill="#475569" text-anchor="middle">EBU-R128 loudness + peak limit</text>
  <text x="285" y="286" font-size="9.6" fill="#475569" text-anchor="middle">optional telephony-codec pass</text>
  <line x1="202" y1="298" x2="368" y2="298" stroke="#c7d2fe" stroke-width="1"/>
  <text x="285" y="313" font-size="9" font-style="italic" fill="#6366f1" text-anchor="middle">identical for bonafide and spoof</text>
  <text x="285" y="325" font-size="9" font-style="italic" fill="#6366f1" text-anchor="middle">fingerprint 640b0644ae</text>

  <!-- fan-out: front-end -> S1 / S2 / S3 -->
  <path d="M388,234 C420,234 432,172 460,172" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M388,262 C432,262 436,276 460,276" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M388,290 C420,290 432,380 460,380" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <!-- metadata -> S4 -->
  <path d="M92,384 C92,470 200,486 458,486" fill="none" stroke="#c084fc" stroke-width="1.6" marker-end="url(#arwP)"/>

  <!-- ============ FOUR SIGNALS ============ -->
  <rect x="444" y="88" width="330" height="456" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="609" y="110" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.6">FOUR SIGNALS &#8212; WEAK ALONE, PARTLY INDEPENDENT</text>

  <!-- S1 -->
  <rect x="460" y="124" width="298" height="96" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="609" y="148" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1 &#183; Synthetic-voice detector</text>
  <text x="609" y="167" font-size="9.4" fill="#475569" text-anchor="middle">AASIST &#8212; vendored clovaai/aasist, published weights</text>
  <text x="609" y="181" font-size="9.4" fill="#475569" text-anchor="middle">windowed scorer + EMA risk timeline</text>
  <text x="609" y="202" font-size="9.4" font-style="italic" fill="#1e40af" text-anchor="middle">In-the-Wild EER 35.8% &#8212; misses current TTS</text>

  <!-- S2 -->
  <rect x="460" y="230" width="298" height="96" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
  <text x="609" y="254" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">2 &#183; Speaker consistency</text>
  <text x="609" y="273" font-size="9.4" fill="#475569" text-anchor="middle">WavLM x-vector (wavlm-base-plus-sv)</text>
  <text x="609" y="287" font-size="9.4" fill="#475569" text-anchor="middle">cosine vs the caller's session enrolment</text>
  <text x="609" y="308" font-size="9.4" font-style="italic" fill="#15803d" text-anchor="middle">mismatch risk &#8212; clone &#8800; enrolled caller</text>

  <!-- S3 -->
  <rect x="460" y="336" width="298" height="96" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.6"/>
  <text x="609" y="360" font-size="12" font-weight="700" fill="#a16207" text-anchor="middle">3 &#183; Prosody / behaviour</text>
  <text x="609" y="379" font-size="9.4" fill="#475569" text-anchor="middle">Praat/Parselmouth: F0, jitter, shimmer, HNR,</text>
  <text x="609" y="393" font-size="9.4" fill="#475569" text-anchor="middle">pause ratio, energy flux &#8594; logistic regression</text>
  <text x="609" y="414" font-size="9.4" font-style="italic" fill="#a16207" text-anchor="middle">dev EER 26.3% &#8212; a contributing signal</text>

  <!-- S4 -->
  <rect x="460" y="442" width="298" height="96" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.6"/>
  <text x="609" y="466" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">4 &#183; Call context</text>
  <text x="609" y="485" font-size="9.4" fill="#475569" text-anchor="middle">rules over caller-known / transfer amount /</text>
  <text x="609" y="499" font-size="9.4" fill="#475569" text-anchor="middle">channel / prior flags</text>
  <text x="609" y="520" font-size="9.4" font-style="italic" fill="#7e22ce" text-anchor="middle">deterministic &#8212; the only non-acoustic signal</text>

  <!-- fan-in: S1..S4 -> fusion -->
  <path d="M758,172 C784,172 792,240 812,248" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M758,278 C784,278 796,256 812,258" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M758,384 C788,376 800,300 812,268" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M758,490 C792,470 806,338 812,280" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ DECISION LAYER ============ -->
  <rect x="800" y="150" width="200" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="900" y="172" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.6">DECISION LAYER</text>

  <rect x="814" y="184" width="172" height="122" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="900" y="207" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Risk fusion</text>
  <text x="900" y="228" font-size="9" fill="#475569" text-anchor="middle">weighted over present signals</text>
  <text x="900" y="243" font-size="9" fill="#475569" text-anchor="middle">renormalised &#183; lone-signal floor</text>
  <text x="900" y="258" font-size="9" fill="#475569" text-anchor="middle">per-signal EMA on the stream</text>
  <text x="900" y="281" font-size="8.8" font-style="italic" fill="#64748b" text-anchor="middle">operating points, not calibrated</text>

  <path d="M900,306 L900,328" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="814" y="330" width="172" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="900" y="353" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Policy engine</text>
  <text x="900" y="375" font-size="9" fill="#475569" text-anchor="middle">scenario thresholds:</text>
  <text x="900" y="389" font-size="9" fill="#475569" text-anchor="middle">routine &#183; transaction &#183;</text>
  <text x="900" y="402" font-size="9" fill="#475569" text-anchor="middle">privileged change</text>
  <text x="900" y="424" font-size="9" fill="#475569" text-anchor="middle">&#8594; action + reason codes</text>
  <text x="900" y="438" font-size="9" fill="#475569" text-anchor="middle">+ recommendation</text>

  <!-- decision -> outcome pills -->
  <path d="M986,398 C996,398 1002,279 1012,279" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M986,410 C1002,410 1004,359 1012,359" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M986,422 C996,422 1002,439 1012,439" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ OUTCOME PILLS ============ -->
  <rect x="1012" y="252" width="150" height="54" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="1087" y="285" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">ALLOW</text>

  <rect x="1012" y="332" width="150" height="54" rx="11" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="1087" y="365" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">VERIFY</text>

  <rect x="1012" y="412" width="150" height="54" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1087" y="445" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">ESCALATE</text>

  <!-- ============ OUTPUTS ROW ============ -->
  <!-- operator console -->
  <rect x="344" y="558" width="278" height="94" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="483" y="582" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">Operator console</text>
  <text x="483" y="601" font-size="9" fill="#475569" text-anchor="middle">decision banner &#183; fused-risk timeline</text>
  <text x="483" y="615" font-size="9" fill="#475569" text-anchor="middle">four signal meters &#183; reason codes</text>
  <text x="483" y="629" font-size="9" fill="#475569" text-anchor="middle">simulated alert &#183; acknowledge</text>

  <!-- human in the loop -->
  <rect x="646" y="558" width="176" height="94" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="734" y="585" font-size="11.5" font-weight="700" fill="#3730a3" text-anchor="middle">Human in the loop</text>
  <text x="734" y="605" font-size="9" fill="#475569" text-anchor="middle">reviews the console,</text>
  <text x="734" y="619" font-size="9" fill="#475569" text-anchor="middle">acknowledges, acts</text>
  <text x="734" y="633" font-size="8.6" font-style="italic" fill="#64748b" text-anchor="middle">no auto-block on synthesis alone</text>

  <!-- feature-only audit log -->
  <rect x="846" y="558" width="314" height="94" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1003" y="582" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">Feature-only audit log &#8212; JSONL</text>
  <text x="1003" y="601" font-size="9" fill="#475569" text-anchor="middle">every decision + acknowledgement:</text>
  <text x="1003" y="615" font-size="9" fill="#475569" text-anchor="middle">scores &#183; action &#183; reasons &#183; versions &#183; commit &#183; time</text>
  <text x="1003" y="630" font-size="9" font-style="italic" fill="#b91c1c" text-anchor="middle">rejects any audio / transcript / embedding key</text>

  <!-- decision -> console, decision -> audit, console -> human -->
  <path d="M818,488 C740,518 560,528 500,556" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M958,488 C980,514 996,534 1000,556" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M622,600 L644,600" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- footer -->
  <text x="34" y="678" font-size="9.3" font-style="italic" fill="#94a3b8">Splits from the official protocol files &#183; In-the-Wild is held out &#183; every result is provenance-stamped in results/tables/ &#183; fusion weights and policy thresholds are documented operating points.</text>
</svg>
