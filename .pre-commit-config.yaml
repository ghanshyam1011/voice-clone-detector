# Keep `rev` here in step with the ruff/nbstripout versions pinned in
# pyproject.toml's [dev] extra, so local hooks and CI format identically.
# `pre-commit autoupdate` + a matching bump in pyproject is the way to move.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: ^data/manifests/  # regenerable join tables, kept for inspection
