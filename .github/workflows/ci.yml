name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[baseline,dev]"
      - name: ruff
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: pytest
        run: pytest -q
        # data-dependent tests self-skip when the corpora aren't present
      - name: notebooks have no output
        run: nbstripout --verify notebooks/*.ipynb
